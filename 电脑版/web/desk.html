<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>拾音 桌面歌词</title>
<!-- 0.2.4 桌面歌词: shown in its own transparent always-on-top window (desklyrics_windows.go).
     The main window sends the parsed lyrics (offset + 歌词转简体 already applied) via /api/desklyrics. -->
<style>
html, body { margin: 0; height: 100%; background: transparent; color-scheme: normal; overflow: hidden; user-select: none; -webkit-user-select: none; cursor: default;
  font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Noto Sans SC", sans-serif; }
body { --base: #fff; --fill: #ff4f73; --s: rgba(0,0,0,.78); --glow: rgba(0,0,0,.45); }
body.c-sky { --fill: #33bbff; }
body.c-gold { --fill: #ffcc33; }
body.c-green { --fill: #2fe08c; }
body.c-ink { --base: #2a2a2e; --fill: #d81e4b; --s: rgba(255,255,255,.92); --glow: rgba(255,255,255,.55); }
#bg { position: absolute; inset: 0; border-radius: 12px; background: rgba(16,16,20,0); transition: background .18s; pointer-events: none; }
body.hover:not(.locked) #bg { background: rgba(16,16,20,.42); }
body.c-ink.hover:not(.locked) #bg { background: rgba(255,255,255,.5); }
#tb { position: absolute; top: 4px; left: 0; right: 0; height: 30px; display: flex; justify-content: center; align-items: center; gap: 4px;
  opacity: 0; pointer-events: none; transition: opacity .18s; }
body.hover:not(.locked) #tb { opacity: 1; pointer-events: auto; }
#tb button { width: 30px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: #fff; display: inline-flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; font: 600 13px/1 inherit; font-family: inherit; }
body.c-ink #tb button { color: #222; }
#tb button:hover { background: rgba(255,255,255,.18); }
body.c-ink #tb button:hover { background: rgba(0,0,0,.1); }
#tb svg { width: 18px; height: 18px; fill: currentColor; }
#tb .sep { width: 1px; height: 16px; background: rgba(255,255,255,.3); margin: 0 4px; }
body.c-ink #tb .sep { background: rgba(0,0,0,.25); }
#tb .dot { width: 22px; }
#tb .dot i { width: 14px; height: 14px; border-radius: 50%; display: block; box-shadow: 0 0 0 1.5px rgba(255,255,255,.75); }
#tb .dot.on i { box-shadow: 0 0 0 2px #fff, 0 0 0 4px rgba(0,0,0,.35); }
body.c-ink #tb .dot i { box-shadow: 0 0 0 1.5px rgba(0,0,0,.4); }
body.c-ink #tb .dot.on i { box-shadow: 0 0 0 2px #222, 0 0 0 4px rgba(255,255,255,.6); }
#rows { position: absolute; top: 36px; left: 0; right: 0; padding: 0 26px; }
.row { position: relative; white-space: nowrap; overflow: hidden; display: flex; align-items: center; }
.row.r1 { justify-content: flex-end; }
.ln { position: relative; display: inline-block; font-weight: 700; letter-spacing: .02em; line-height: 1.3; white-space: nowrap;
  text-shadow: 1px 0 0 var(--s), -1px 0 0 var(--s), 0 1px 0 var(--s), 0 -1px 0 var(--s), 1px 1px 0 var(--s), -1px -1px 0 var(--s), 1px -1px 0 var(--s), -1px 1px 0 var(--s), 0 2px 6px var(--glow); }
.ln .b { color: var(--base); }
.ln .f { position: absolute; left: 0; top: 0; width: 0; overflow: hidden; color: var(--fill); }
.row.cur .ln { opacity: 1; }
.row.nxt .ln { opacity: .9; font-weight: 600; }
.row.hl .ln .b { color: var(--fill); }
.grip { position: absolute; top: 0; bottom: 0; width: 8px; cursor: ew-resize; display: none; }
.grip.l { left: 0; } .grip.r { right: 0; }
body.hover:not(.locked) .grip { display: block; }
/* 0.2.5: locked + cursor over the lyrics (reported by the window's 10 Hz cursor poll) → 「🔓 解锁」 pill.
   Only the pill's rect is made clickable by the window; same numbers as deskPillDef in desklyrics.go. */
#unlock { position: absolute; top: 4px; left: 50%; width: 30px; height: 28px; margin-left: -15px; box-sizing: border-box;
  border: 0; border-radius: 6px; background: transparent; color: #fff; padding: 0; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .2s, background .15s; }
#unlock svg { width: 18px; height: 18px; fill: currentColor; filter: drop-shadow(0 0 1px rgba(0,0,0,.9)) drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
body.locked.lockhover #unlock { opacity: 1; pointer-events: auto; }
#unlock:hover { background: rgba(255,255,255,.18); }
body.c-ink #unlock { color: #222; }
body.c-ink #unlock svg { filter: drop-shadow(0 0 1px rgba(255,255,255,.9)) drop-shadow(0 1px 3px rgba(255,255,255,.6)); }
body.c-ink #unlock:hover { background: rgba(0,0,0,.1); }
</style>
</head>
<body class="c-rose">
<div id="bg"></div>
<div id="tb">
  <button data-c="prev" title="上一首"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
  <button data-c="toggle" id="bPlay" title="播放/暂停"></button>
  <button data-c="next" title="下一首"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
  <span class="sep"></span>
  <button data-a="smaller" title="缩小字号">A−</button>
  <button data-a="bigger" title="放大字号">A+</button>
  <span class="sep"></span>
  <span id="dots"></span>
  <span class="sep"></span>
  <button data-a="lock" id="bLock" title="锁定（锁定后鼠标可穿透；鼠标移到歌词上点小锁解锁）"><svg viewBox="0 0 24 24"><path d="M18 8h-1V6A5 5 0 0 0 7 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zm-6 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4zM9 8V6a3 3 0 1 1 6 0v2H9z"/></svg></button>
  <button data-a="close" title="关闭桌面歌词"><svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
</div>
<button id="unlock" title="解锁桌面歌词"><svg viewBox="0 0 24 24"><path d="M18 8h-1V6A5 5 0 0 0 7 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zm-6 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4zM9 8V6a3 3 0 1 1 6 0v2H9z"/></svg></button>
<div id="rows"><div class="row r0"></div><div class="row r1"></div></div>
<div class="grip l"></div><div class="grip r"></div>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
const COLOR = { rose: ['#ff4f73', '粉红'], sky: ['#33bbff', '天蓝'], gold: ['#ffcc33', '金黄'], green: ['#2fe08c', '翠绿'], ink: ['#2a2a2e', '深色（浅色壁纸用）'] };
const host = window.chrome && window.chrome.webview;
const post = (m) => { if (host) host.postMessage(m); };
const D = { v: -1, prefs: { size: 36, color: 'rose' }, now: {}, idx: null, key: '', sizeMin: 20, sizeMax: 64 };
const rows = [$('.r0'), $('.r1')];

async function call(path, body) {
  try { const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); return await r.json(); } catch (_) { return null; }
}
// ---- layout (same numbers as deskHeightCSS in desklyrics.go) ----
const rowH = () => Math.ceil(D.prefs.size * 1.3);
function layout() {
  rows.forEach((r) => { r.style.height = rowH() + 'px'; });
  document.body.className = document.body.className.replace(/\bc-\w+/, '') + ' c-' + (D.prefs.color || 'rose');
  $('#dots').innerHTML = Object.keys(COLOR).map((k) => `<button class="dot ${k === D.prefs.color ? 'on' : ''}" data-color="${k}" title="${COLOR[k][1]}"><i style="background:${COLOR[k][0]}"></i></button>`).join('');
  document.body.classList.toggle('locked', !!D.prefs.locked);
  if (D.prefs.locked) document.body.classList.remove('hover');
  else document.body.classList.remove('lockhover');
  const hk = D.hotkey ? `（快捷键 ${D.hotkey}）` : '';
  $('#unlock').title = '解锁桌面歌词' + hk;
  $('#bLock').title = '锁定' + hk + '：锁定后鼠标可穿透，鼠标移到歌词上点小锁解锁';
  reportPill();
}
// the window needs the pill's rect (CSS px) to make exactly that area clickable while locked
function reportPill() {
  const r = $('#unlock').getBoundingClientRect();
  if (r.width) post(`pill:${Math.round(r.left)},${Math.round(r.top)},${Math.round(r.right)},${Math.round(r.bottom)}`);
}
// called by the window (ExecuteScript) while locked: cursor entered / left the lyrics window
window.deskLockHover = (on) => { document.body.classList.toggle('lockhover', !!on && !!D.prefs.locked); return document.body.classList.contains('lockhover'); };
function setLine(row, text, cur, hl) {
  const big = D.prefs.size, small = Math.round(big * 0.72);
  row.className = row.className.replace(/\b(cur|nxt|hl)\b/g, '').trim() + (cur ? ' cur' : ' nxt') + (hl ? ' hl' : '');
  row.innerHTML = text ? '<span class="ln"><span class="b"></span><span class="f"></span></span>' : '';
  if (!text) return;
  const ln = row.firstChild;
  ln.querySelector('.b').textContent = text; ln.querySelector('.f').textContent = text;
  let fs = cur ? big : small;
  ln.style.fontSize = fs + 'px';
  const avail = row.clientWidth;
  if (ln.scrollWidth > avail && avail > 0) { // too long: shrink to fit (down to 60 %), never cut words off silently
    fs = Math.max(Math.floor(fs * avail / ln.scrollWidth), Math.round((cur ? big : small) * 0.6));
    ln.style.fontSize = fs + 'px';
    if (ln.scrollWidth > avail) { ln.style.maxWidth = avail + 'px'; ln.style.overflow = 'hidden'; ln.style.textOverflow = 'ellipsis'; ln.querySelector('.b').style.cssText = 'display:block;overflow:hidden;text-overflow:ellipsis'; }
  }
}
// ---- time ----
function pos() {
  const n = D.now; if (!n || n.id == null) return 0;
  let p = +n.pos || 0;
  if (n.playing && n.at) p += (Date.now() - n.at) / 1000 * (+n.rate || 1);
  return p + (+n.offset || 0) / 1000;
}
function curIndex(lines, t) { let i = -1; for (let k = 0; k < lines.length; k++) { if (lines[k].t <= t) i = k; else break; } return i; }
function render(force) {
  const n = D.now || {};
  const lines = Array.isArray(n.lines) && n.lines.length ? n.lines : null;
  const title = n.title ? (n.artist && n.artist !== '未知歌手' ? `${n.title} - ${n.artist}` : n.title) : '';
  $('#bPlay').innerHTML = n.playing ? ICON_PAUSE : ICON_PLAY;
  let key, a, b, cur = 0, fillLine = null;
  if (n.id == null) { key = 'idle'; a = '拾音'; b = ''; }
  else if (!lines) { key = 'nolyr|' + title; a = title || '拾音'; b = '拾音'; }
  else {
    const i = curIndex(lines, pos() + 0.25);
    if (i < 0) { key = 'pre|' + title; a = title; b = lines[0] ? lines[0].text : ''; }
    else {
      key = 'l|' + i;
      cur = i % 2;
      const pair = [];
      pair[cur] = lines[i].text || '♪';
      pair[1 - cur] = lines[i + 1] ? lines[i + 1].text : '';
      [a, b] = pair; fillLine = i;
    }
  }
  key += '|' + D.prefs.size + '|' + document.body.clientWidth;
  if (key !== D.key || force) {
    D.key = key;
    setLine(rows[0], a, cur === 0, fillLine === null && cur === 0 && n.id != null);
    setLine(rows[1], b, cur === 1, false);
    D.fillEl = fillLine !== null ? rows[cur].querySelector('.f') : null;
  }
  if (D.fillEl && fillLine !== null) {
    const l = lines[fillLine], nx = lines[fillLine + 1];
    const gap = nx ? nx.t - l.t : 5;
    const dur = Math.max(0.8, Math.min(gap, (l.text || '').length * 0.45 + 1));
    const p = Math.max(0, Math.min(1, (pos() + 0.1 - l.t) / dur));
    D.fillEl.style.width = (p * 100).toFixed(1) + '%';
  }
}
// ~30 fps only while playing synced lyrics; otherwise idle (re-rendered on updates)
let lastFrame = 0;
function frame(ts) {
  const n = D.now || {};
  if (n.playing && Array.isArray(n.lines) && n.lines.length && !document.hidden) {
    if (ts - lastFrame >= 33) { lastFrame = ts; render(); }
    requestAnimationFrame(frame);
  } else D.anim = false;
}
function kick() { render(); if (!D.anim) { D.anim = true; requestAnimationFrame(frame); } }

async function poll() {
  for (;;) {
    let d = null;
    try { const r = await fetch('/api/desklyrics?since=' + D.v + '&wait=25'); if (r.ok) d = await r.json(); } catch (_) {}
    if (!d) { await new Promise((r) => setTimeout(r, 2000)); continue; }
    const relayout = !D.prefs || d.prefs.size !== D.prefs.size || d.prefs.color !== D.prefs.color || d.prefs.locked !== D.prefs.locked || (d.hotkey || '') !== (D.hotkey || '');
    D.hotkey = d.hotkey || '';
    D.v = d.v; D.prefs = d.prefs; D.now = d.now || {}; D.sizeMin = d.sizeMin || 20; D.sizeMax = d.sizeMax || 64;
    if (relayout) { layout(); D.key = ''; }
    kick();
  }
}
// ---- toolbar / hover / drag ----
document.addEventListener('mouseenter', () => { if (!D.prefs.locked) document.body.classList.add('hover'); });
document.addEventListener('mousemove', () => { if (!D.prefs.locked) document.body.classList.add('hover'); });
document.addEventListener('mouseleave', () => document.body.classList.remove('hover'));
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('mousedown', (e) => {
  if (e.button !== 0 || D.prefs.locked) return;
  if (e.target.closest('.grip')) { post(e.target.closest('.grip').classList.contains('l') ? 'size-l' : 'size-r'); return; }
  if (e.target.closest('button')) return;
  post('drag');
});
$('#unlock').addEventListener('click', async () => {
  await setPrefs({ locked: false });
  document.body.classList.remove('lockhover');
  document.body.classList.add('hover'); // cursor is on the window: toolbar back at once
});
$('#tb').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.c) return call('/api/desklyrics/cmd', { cmd: b.dataset.c });
  if (b.dataset.color) return setPrefs({ color: b.dataset.color });
  const a = b.dataset.a;
  if (a === 'smaller') return setPrefs({ size: Math.max(D.sizeMin, D.prefs.size - 4) });
  if (a === 'bigger') return setPrefs({ size: Math.min(D.sizeMax, D.prefs.size + 4) });
  if (a === 'lock') { document.body.classList.remove('hover'); return setPrefs({ locked: true }); }
  if (a === 'close') return setPrefs({ on: false });
});
async function setPrefs(p) { const r = await call('/api/desklyrics/prefs', p); if (r && r.size) { D.prefs = r; layout(); render(true); } return r; }
window.addEventListener('resize', () => { render(true); reportPill(); });
layout(); render(true); poll();
</script>
</body>
</html>
